<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>To-do app</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
    li { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
    li.done span { text-decoration: line-through; color: gray; }
    li span { flex: 1; }
  </style>
</head>
<body>
  <h1>To-do</h1>
  <form id="new">
    <input id="text" placeholder="What needs doing?" required autofocus>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <p id="summary"></p>

  <script>
    /*
    Everything combined:
      state in an array -> render() draws it -> events change state -> save + render again
    This "state -> render" loop is the core idea behind React, Vue and Svelte.
    */
    let todos = JSON.parse(localStorage.getItem("todos")) ?? [];

    const list = document.getElementById("list");
    const form = document.getElementById("new");
    const input = document.getElementById("text");

    function save() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function render() {
      list.replaceChildren(...todos.map(todo => {
        const li = document.createElement("li");
        li.dataset.id = todo.id;
        li.classList.toggle("done", todo.done);

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.dataset.action = "toggle";

        const text = document.createElement("span");
        text.textContent = todo.text;// textContent: safe from HTML injection

        const del = document.createElement("button");
        del.textContent = "✕";
        del.dataset.action = "delete";

        li.append(checkbox, text, del);
        return li;
      }));
      const left = todos.filter(t => !t.done).length;
      document.getElementById("summary").textContent = `${left} of ${todos.length} left`;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      todos.push({ id: crypto.randomUUID(), text: input.value.trim(), done: false });
      input.value = "";
      save();
      render();
    });

    // One delegated listener for every row
    list.addEventListener("click", (e) => {
      const action = e.target.dataset.action;
      if (!action) return;
      const id = e.target.closest("li").dataset.id;
      if (action === "toggle") todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
      if (action === "delete") todos = todos.filter(t => t.id !== id);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
