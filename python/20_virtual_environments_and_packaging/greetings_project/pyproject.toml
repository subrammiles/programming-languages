[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greetings"
version = "0.1.0"
description = "A tiny example package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
greet = "greetings.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
